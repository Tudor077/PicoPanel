name: Android APK

# Builds PicoPanel Pocket and attaches the APK to the run, so it can be
# installed straight onto a phone from the run page - no PC, no Android Studio.

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write        # needed to attach the APK to a release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name it after the run
        working-directory: android
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/PicoPanel-Pocket-${GITHUB_RUN_NUMBER}.apk"
          ls -lh out

      - name: Upload the APK to the run
        uses: actions/upload-artifact@v4
        with:
          name: PicoPanel-Pocket-apk
          path: android/out/*.apk
          if-no-files-found: error

      # An Actions artifact is a login-gated zip, which is painful to install
      # from a phone. A release asset is a direct .apk link you can tap.
      - name: Publish it as a release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pocket-build-${{ github.run_number }}
          name: PicoPanel Pocket build ${{ github.run_number }}
          prerelease: true
          files: android/out/*.apk
          body: |
            Debug-signed APK of PicoPanel Pocket, built from `${{ github.sha }}`.

            Tap the `.apk` below on your phone to install. Android will ask you
            to allow installs from your browser the first time.

            Works with no hardware attached: the app opens in emulator mode and
            runs a simulated panel. Plug the real panel in over USB-C OTG and
            tap **USB PANEL** to switch to it.
